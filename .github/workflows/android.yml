name: Android Build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # publish the latest build as a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: blake-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Record screenshots (light + dark, every screen)
        run: gradle recordRoborazziDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blake-screenshots
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: warn

      # The app's "Check for updates" compares its own build with this release. Only a build whose
      # tests passed is published, and a failure here never fails the build itself.
      - name: Publish build as the latest release
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "app/build/outputs/apk/debug/app-debug.apk#blake-debug.apk"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Blake $short"             --notes "Latest build from main. Commit $GITHUB_SHA"             --prerelease
