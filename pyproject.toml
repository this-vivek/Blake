[project]
name = "blake"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*", "modules*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
